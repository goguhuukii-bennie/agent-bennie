<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Baby Bennie</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{ --bg:#FFF0F6; --main:#F6A5C9; --dark:#E889B5; --white:#FFFFFF; }
*{margin:0;padding:0;box-sizing:border-box;font-family:'Mitr',sans-serif;}
body{ background:var(--bg); display:flex; justify-content:center; min-height: 100vh; padding: 20px 0; }
.container{ max-width:500px; width:100%; padding:0 15px; }
.section{ background:var(--white); border-radius:25px; padding:25px; margin-bottom:20px; box-shadow:0 8px 20px rgba(0,0,0,0.05); border:2px solid var(--main); }
h1, h2 { color: var(--dark); text-align: center; margin-bottom: 15px; }

/* บอร์ดประกาศ */
.announcement-box { background: #fff9fb; border-radius: 15px; padding: 15px; border-left: 5px solid var(--main); margin-bottom: 15px; }
#ruleDisplay { font-size: 14px; color: #d06d9b; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

.form-group { margin-bottom: 15px; }
label { display: block; font-size: 14px; color: var(--dark); margin-bottom: 5px; font-weight: 500; }
input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ffeef5; background: #fffcfd; outline: none; font-family: 'Mitr'; font-size: 14px; }

/* ปรับปรุงส่วนติ๊กถูกให้เต็มความกว้างช่อง */
.confirm-container {
    background: #fff9fb;
    border-radius: 15px;
    border: 1px dashed var(--main);
    padding: 5px 15px;
    margin-bottom: 15px;
}
.check-item { 
    display: flex; 
    gap: 15px; 
    align-items: center; /* จัดให้กล่องติ๊กถูกกับข้อความอยู่กลางแนวนอน */
    cursor: pointer; 
    font-size: 13px; 
    color: #666; 
    padding: 15px 0;
    line-height: 1.4;
    word-break: break-word;
    width: 100%; /* ให้ยาวเต็มช่อง */
}
.check-item span { flex: 1; } /* ให้ข้อความขยายเต็มพื้นที่ที่เหลือ */
.check-item:first-child { border-bottom: 1px solid #fce4ec; }

input[type="checkbox"] { 
    min-width: 20px; 
    min-height: 20px; 
    cursor: pointer; 
    accent-color: var(--main); /* เปลี่ยนสีติ๊กถูกให้เป็นสีชมพู */
}

.btn-submit { background: var(--main); color: white; border: none; padding: 15px; border-radius: 25px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; font-family: 'Mitr'; }
.btn-submit:disabled { background: #ccc; cursor: not-allowed; }

/* Style สำหรับ Pop-up */
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
}
.modal-content {
    background: white; padding: 30px; border-radius: 30px; text-align: center; max-width: 400px; width: 100%;
    border: 4px solid var(--main); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.contact-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none; padding: 12px; border-radius: 15px; margin: 10px 0; font-weight: 500; transition: 0.3s;
}
.fb-btn { background: #E7F3FF; color: #1877F2; }
.line-btn { background: #E7F9EE; color: #06C755; }
.contact-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

.floating-emoji { position: fixed; bottom: -10%; z-index: -1; pointer-events: none; opacity: 0.3; animation: floatUp linear infinite; }
@keyframes floatUp { 0%{transform:translateY(0) rotate(0deg);opacity:0} 100%{transform:translateY(-110vh) rotate(360deg);opacity:0} }
</style>
</head>
<body>

<div id="emoji-container"></div>

<div class="modal-overlay" id="contactModal">
    <div class="modal-content">
        <div style="font-size: 50px; margin-bottom: 10px;">💖</div>
        <h2 style="color: var(--dark);">ส่งข้อมูลเรียบร้อยค่ะ!</h2>
        <p style="font-size: 14px; color: #888; margin-bottom: 20px;">ติดต่อแอดมินได้เสม๊อออ~<br>เพื่อความรวดเร็วในการแจ้งผลนะคะ</p>
        
        <a href="https://www.facebook.com/biebxnz?" target="_blank" class="contact-btn fb-btn">
            <span>🔵 Facebook: biebxnz</span>
        </a>
        
        <a href="https://line.me/ti/p/GKW1TDYvpB" target="_blank" class="contact-btn line-btn">
            <span>🟢 Line: Baby Bennie</span>
        </a>
        
        <button onclick="location.reload()" style="background: none; border: none; color: #ccc; margin-top: 15px; cursor: pointer; font-family: 'Mitr'; text-decoration: underline;">ปิดหน้านี้</button>
    </div>
</div>

<div class="container">
    <div class="section">
        <div style="font-size: 24px; text-align: center; margin-bottom: 10px;">📢 ประกาศจากทางร้าน</div>
        <div class="announcement-box">
            <div id="ruleDisplay">กำลังโหลดประกาศล่าสุด...</div>
        </div>
    </div>

    <form id="regForm">
        <div class="section">
            <h2>📝 ข้อมูลสมัครตัวแทน</h2>
            <div class="form-group"><label>ชื่อ-นามสกุล *</label><input type="text" name="fullName" required placeholder="ระบุชื่อจริง"></div>
            <div class="form-group"><label>ชื่อเล่น *</label><input type="text" name="nickName" required placeholder="ระบุชื่อเล่น"></div>
            <div class="form-group"><label>ช่องทางการขาย *</label><input type="text" name="shop" required placeholder="เช่น TikTok, FB, IG"></div>
            <div class="form-group"><label>อีเมล *</label><input type="email" name="email" required placeholder="example@mail.com"></div>
            <div class="form-group"><label>ลิงก์ Facebook *</label><input type="url" name="fbLink" required placeholder="วางลิงก์ไลน์"></div>
            <div class="form-group"><label>ลิงก์ LINE *</label><input type="url" name="lineLink" required placeholder="วางลิงก์ไลน์"></div>

            <div class="confirm-container">
                <label class="check-item">
                    <input type="checkbox" id="photoConfirm" onchange="checkBoth()" required>
                    <span><b>ยืนยันส่งรูป:</b> ฉันรับทราบว่าต้องส่งรูปทำป้ายเข้าทางแชทแอดมินโดยตรงค่ะ 📸</span>
                </label>

                <label class="check-item">
                    <input type="checkbox" id="agree" onchange="checkBoth()" required>
                    <span>ฉันอ่านประกาศและยอมรับเงื่อนไขทั้งหมด</span>
                </label>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit" disabled>ยืนยันการสมัคร ✨</button>
        </div>
        <input type="hidden" name="imgFile" value="รับทราบ/จะส่งรูปในแชท">
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyekpXWWPSSOXSGjiX-W9TUYwWxcPH7QA1ZkFvr3wR8NYcvNbd6HdVVLueMSxGw-jGaEw/exec';

    window.onload = function() {
        fetch(scriptURL).then(r => r.text()).then(t => {
            document.getElementById('ruleDisplay').innerText = t || "ยินดีต้อนรับค่ะ ✨";
        });
    };

    function checkBoth() {
        const photo = document.getElementById('photoConfirm').checked;
        const agree = document.getElementById('agree').checked;
        document.getElementById('submitBtn').disabled = !(photo && agree);
    }

    const form = document.getElementById('regForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "กำลังบันทึกข้อมูล...";

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                document.getElementById('contactModal').style.display = 'flex';
            })
            .catch(error => {
                alert("เกิดข้อผิดพลาด ลองใหม่อีกครั้งนะคะ");
                btn.disabled = false;
                btn.innerText = "ยืนยันการสมัคร ✨";
            });
    });

    const emojis = ['🐶', '⭐️', '🌷', '🩷'];
    function createEmoji() {
        const e = document.createElement('div'); e.className = 'floating-emoji';
        e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
        e.style.left = Math.random()*100+'vw'; e.style.fontSize = (Math.random()*20+20)+'px';
        e.style.animationDuration = (Math.random()*10+10)+'s';
        document.getElementById('emoji-container').appendChild(e);
        setTimeout(()=>e.remove(), 10000);
    }
    setInterval(createEmoji, 1500);
</script>
</body>
</html>
