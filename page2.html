<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register - Baby Bennie</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{ --bg:#FFF0F6; --main:#F6A5C9; --dark:#E889B5; --white:#FFFFFF; }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Mitr',sans-serif;}
        body{ background:var(--bg); display:flex; justify-content:center; min-height: 100vh; padding: 20px 0; }
        .container{ max-width:500px; width:100%; padding:0 15px; }
        .section{ background:var(--white); border-radius:25px; padding:25px; margin-bottom:20px; box-shadow:0 8px 20px rgba(0,0,0,0.05); border:2px solid var(--main); }
        h2 { color: var(--dark); text-align: center; margin-bottom: 20px; font-size: 22px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: var(--dark); margin-bottom: 5px; font-weight: 500; }
        input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ffeef5; background: #fffcfd; outline: none; font-size: 14px; font-family: 'Mitr'; }
        
        /* แก้ปัญหา iPad/Tablet ตัวหนังสือแนวตั้ง */
        .confirm-box { background: #fff9fb; border-radius: 15px; border: 1px dashed var(--main); margin-bottom: 15px; padding: 5px; }
        .row-check { display: table; width: 100%; cursor: pointer; padding: 15px; }
        .row-check:first-child { border-bottom: 1px solid #fce4ec; }
        .row-check input { display: table-cell; min-width: 22px !important; height: 22px !important; vertical-align: top; accent-color: var(--main); }
        .row-check span { display: table-cell; padding-left: 15px; font-size: 14px; color: #666; line-height: 1.5; vertical-align: middle; text-align: left; }

        .btn-submit { background: var(--main); color: white; border: none; padding: 16px; border-radius: 30px; font-size: 16px; cursor: pointer; width: 100%; font-family: 'Mitr'; font-weight: 500; transition: 0.3s; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-body { background: white; padding: 30px; border-radius: 30px; text-align: center; max-width: 400px; width: 100%; border: 4px solid var(--main); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .contact-link { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; padding: 12px; border-radius: 15px; margin: 10px 0; font-weight: 500; }
        .fb-btn { background: #E7F3FF; color: #1877F2; }
        .line-btn { background: #E7F9EE; color: #06C755; }
    </style>
</head>
<body>

<div class="modal" id="pop">
    <div class="modal-body">
        <div style="font-size: 50px; margin-bottom: 10px;">💖</div>
        <h2>ส่งข้อมูลสำเร็จแล้วค่ะ!</h2>
        <p style="font-size: 14px; color: #888; margin-bottom: 20px;">ทักแอดมินมาแจ้งชื่อสมัครได้เลยน้าาา</p>
        <a href="https://www.facebook.com/biebxnz?" target="_blank" class="contact-link fb-btn">🔵 Facebook: biebxnz</a>
        <a href="https://line.me/ti/p/GKW1TDYvpB" target="_blank" class="contact-link line-btn">🟢 Line: Baby Bennie</a>
        <button onclick="window.location.reload()" style="background:none; border:none; color:#bbb; text-decoration:underline; cursor:pointer; margin-top:15px; font-family:'Mitr';">ปิดหน้าต่าง</button>
    </div>
</div>

<div class="container">
    <div class="section">
        <h2 style="font-size: 18px; margin-bottom: 10px;">📢 ประกาศจากทางร้าน</h2>
        <div style="background: #fff9fb; border-radius: 15px; padding: 15px; border-left: 5px solid var(--main); font-size: 14px; color: #d06d9b; line-height: 1.6; white-space: pre-wrap;">
ยินดีต้อนรับสู่ Baby Bennie ค่ะ ✨
กรุณากรอกข้อมูลให้ครบถ้วนเพื่อผลประโยชน์ของตัวท่านเองนะคะ
        </div>
    </div>

    <form id="f" action="https://formspree.io/f/xnjlejwb" method="POST">
        <div class="section">
            <h2>📝 สมัครตัวแทน</h2>
            <div class="form-group"><label>ชื่อ-นามสกุล *</label><input type="text" name="fullName" required></div>
            <div class="form-group"><label>ชื่อเล่น *</label><input type="text" name="nickName" required></div>
            <div class="form-group"><label>ช่องทางการขาย *</label><input type="text" name="shop" required placeholder="TikTok, FB, IG"></div>
            <div class="form-group"><label>อีเมล *</label><input type="email" name="email" required></div>
            
            <hr style="border: 0; border-top: 1px solid #ffeef5; margin: 20px 0;">

            <div class="form-group"><label>ชื่อ Facebook *</label><input type="text" name="fbName" required placeholder="ระบุชื่อเฟสบุ๊ค"></div>
            <div class="form-group"><label>ลิงก์ Facebook *</label><input type="url" name="fbLink" required placeholder="https://facebook.com/..."></div>
            
            <div class="form-group" style="margin-top: 15px;"><label>ไอดี LINE *</label><input type="text" name="lineID" required placeholder="ระบุไอดีไลน์"></div>
            <div class="form-group"><label>ลิงก์ LINE *</label><input type="url" name="lineLink" required placeholder="https://line.me/ti/p/..."></div>

            <div class="confirm-box" style="margin-top: 25px;">
                <label class="row-check"><input type="checkbox" id="c1" required><span>ยืนยันจะส่งรูปทำป้ายในแชทค่ะ 📸</span></label>
                <label class="row-check"><input type="checkbox" id="c2" required onchange="v()"><span>ฉันอ่านประกาศและยอมรับเงื่อนไขทั้งหมด</span></label>
            </div>

            <button type="submit" id="sub" class="btn-submit" disabled>ยืนยันสมัคร ✨</button>
        </div>
        <input type="hidden" name="imgFile" value="รับทราบ/จะส่งรูปในแชท">
    </form>
</div>

<script>
    function v() { 
        document.getElementById('sub').disabled = !(document.getElementById('c1').checked && document.getElementById('c2').checked); 
    }
    document.getElementById('c1').addEventListener('change', v);

    const form = document.getElementById('f');
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const b = document.getElementById('sub');
        b.disabled = true; b.innerText = "กำลังส่งข้อมูล...";

        const data = new FormData(form);
        const response = await fetch(form.action, {
            method: 'POST',
            body: data,
            headers: { 'Accept': 'application/json' }
        });
0
        if (response.ok) {
            document.getElementById('pop').style.display = 'flex';
            b.innerText = "ยืนยันสมัคร ✨";
            form.reset();
        } else {
            alert("เกิดข้อผิดพลาด ลองใหม่อีกครั้งนะคะ");
            b.disabled = false;
            b.innerText = "ยืนยันสมัคร ✨";
        }
    });
</script>
</body>
</html>
