<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register - Baby Bennie</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{ --bg:#FFF0F6; --main:#F6A5C9; --dark:#E889B5; --white:#FFFFFF; }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Mitr',sans-serif;}
        body{ background:var(--bg); display:flex; justify-content:center; min-height: 100vh; padding: 20px 0; }
        .container{ max-width:550px; width:100%; padding:0 15px; }
        .section{ background:var(--white); border-radius:25px; padding:25px; margin-bottom:20px; box-shadow:0 8px 20px rgba(0,0,0,0.05); border:2px solid var(--main); }
        h2 { color: var(--dark); text-align: center; margin-bottom: 20px; }
        
        /* ประกาศดึงจาก Sheets Rules A1 */
        .announcement-box { background: #fff9fb; border-radius: 15px; padding: 15px; border-left: 5px solid var(--main); margin-bottom: 10px; }
        #ruleDisplay { font-size: 14px; color: #d06d9b; line-height: 1.6; white-space: pre-wrap; width: 100%; word-break: break-word; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: var(--dark); margin-bottom: 5px; font-weight: 500; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ffeef5; background: #fffcfd; outline: none; font-size: 14px; font-family: 'Mitr'; }
        
        /* แก้ปัญหา iPad: บังคับการจัดวางแนวนอนตลอดกาล */
        .confirm-box { background: #fff9fb; border-radius: 15px; border: 1px dashed var(--main); margin-bottom: 15px; padding: 5px; }
        .row-check { display: table; width: 100%; cursor: pointer; padding: 15px; }
        .row-check:first-child { border-bottom: 1px solid #fce4ec; }
        .row-check input { display: table-cell; min-width: 24px !important; height: 24px !important; vertical-align: top; accent-color: var(--main); cursor: pointer; }
        .row-check span { display: table-cell; padding-left: 15px; font-size: 14px; color: #666; line-height: 1.5; vertical-align: middle; text-align: left; }

        .btn-submit { background: var(--main); color: white; border: none; padding: 18px; border-radius: 35px; font-size: 16px; cursor: pointer; width: 100%; font-family: 'Mitr'; font-weight: 500; transition: 0.3s; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        
        /* ป๊อปอัพสมบูรณ์แบบ */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-body { background: white; padding: 30px; border-radius: 30px; text-align: center; max-width: 400px; width: 100%; border: 4px solid var(--main); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .contact-link { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; padding: 12px; border-radius: 15px; margin: 10px 0; font-weight: 500; }
        .fb-btn { background: #E7F3FF; color: #1877F2; }
        .line-btn { background: #E7F9EE; color: #06C755; }
    </style>
</head>
<body>

<div class="modal" id="pop"><div class="modal-body">
    <div style="font-size: 50px; margin-bottom: 10px;">💖</div>
    <h2>สมัครสำเร็จแล้วค่ะ!</h2>
    <p style="font-size: 14px; color:#888; margin-bottom:20px;">ทักแอดมินมาแจ้งชื่อสมัครได้เลยนะคะ</p>
    <a href="https://www.facebook.com/biebxnz?" target="_blank" class="contact-link fb-btn">🔵 Facebook: biebxnz</a>
    <a href="https://line.me/ti/p/GKW1TDYvpB" target="_blank" class="contact-link line-btn">🟢 Line: Baby Bennie</a>
    <button onclick="window.location.reload()" style="background:none; border:none; color:#bbb; text-decoration:underline; cursor:pointer; margin-top:15px; font-family:'Mitr';">ปิดหน้าต่าง</button>
</div></div>

<div class="container">
    <div class="section">
        <h2 style="font-size: 18px; margin-bottom: 10px;">📢 ประกาศจากทางร้าน</h2>
        <div class="announcement-box"><div id="ruleDisplay">กำลังโหลดประกาศล่าสุด...</div></div>
        <p style="font-size: 10px; color: #ccc; text-align: right;">* ข้อมูลอัปเดตจากชีท Rules</p>
    </div>

    <form id="f"><div class="section">
        <h2>📝 ข้อมูลสมัครตัวแทน</h2>
        <div class="form-group"><label>ชื่อ-นามสกุล *</label><input type="text" name="fullName" required placeholder="ชื่อ-นามสกุล"></div>
        <div class="form-group"><label>ชื่อเล่น *</label><input type="text" name="nickName" required placeholder="ชื่อเล่นสำหรับทำป้าย"></div>
        <div class="form-group"><label>ช่องทางการขาย *</label><input type="text" name="shop" required placeholder="เช่น TikTok, FB, IG"></div>
        <div class="form-group"><label>อีเมล *</label><input type="email" name="email" required placeholder="example@email.com"></div>
        <div class="form-group"><label>ลิงก์ Facebook *</label><input type="url" name="fbLink" required placeholder="วางลิงก์เฟสบุ๊ค"></div>
        <div class="form-group"><label>ลิงก์ LINE *</label><input type="url" name="lineLink" required placeholder="วางลิงก์ไลน์"></div>
        
        <div class="confirm-box">
            <label class="row-check"><input type="checkbox" id="ck1" required><span>ยืนยันส่งรูปทำป้ายในแชทเพื่อความชัดค่ะ 📸</span></label>
            <label class="row-check"><input type="checkbox" id="ck2" required onchange="v()"><span>ฉันอ่านประกาศและยอมรับเงื่อนไขทั้งหมด</span></label>
        </div>
        <button type="submit" id="sub" class="btn-submit" disabled>ยืนยันสมัครตัวแทน ✨</button>
    </div><input type="hidden" name="imgFile" value="จะส่งรูปในแชท"></form>
</div>

<script>
    // ใช้ลิงก์ล่าสุดที่มึงส่งมา (เช็คแล้วถูกต้อง)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyS2pVUgUwIkMI4l1qWkeOpF4u54eo7div4V-tGJHjnVSYqwANphBdcQBw0c5meU9-wGQ/exec';

    // ดึงประกาศ (doGet)
    window.onload = function() {
        fetch(scriptURL).then(r => r.text()).then(t => {
            document.getElementById('ruleDisplay').innerText = t || "ยินดีต้อนรับสู่ครอบครัว Baby Bennie ค่ะ ✨";
        }).catch(e => {
            document.getElementById('ruleDisplay').innerText = "ยินดีต้อนรับสู่ครอบครัว Baby Bennie ค่ะ ✨";
        });
    };

    function v() { document.getElementById('sub').disabled = !(document.getElementById('ck1').checked && document.getElementById('ck2').checked); }
    document.getElementById('ck1').addEventListener('change', v);

    document.getElementById('f').addEventListener('submit', e => {
        e.preventDefault();
        const b = document.getElementById('sub');
        b.disabled = true; b.innerText = "กำลังบันทึกข้อมูล...";

        // mode no-cors เพื่อให้ส่งผ่านข้ามเว็บได้เสถียรที่สุด
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: new FormData(document.getElementById('f'))})
            .then(() => { 
                document.getElementById('pop').style.display = 'flex'; 
                b.innerText = "ยืนยันสมัครตัวแทน ✨"; 
            })
            .catch(() => { 
                alert("เกิดข้อผิดพลาดนิดหน่อย ลองกดใหม่อีกครั้งนะคะ"); 
                b.disabled = false;
                b.innerText = "ยืนยันสมัครตัวแทน ✨"; 
            });
    });
</script>
</body>
</html>
